<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>
.dashboard-card {
  max-width: 900px;
  margin: 30px auto;
  padding: 20px;
  background-color: var(--card-bg);
  border-radius: 16px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

.dashboard-card h2 {
  color: var(--main-color);
  margin-bottom: 12px;
}

.dashboard-card input {
  width: 100%;
  margin: 6px 0;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
}

.dashboard-card button {
  margin-top: 8px;
  padding: 8px 14px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  background-color: var(--main-color);
  color: #fff;
}

.dashboard-row {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.dashboard-row img {
  max-width: 100%;
  border-radius: 10px;
  margin-top: 10px;
}
</style>
</head>

<body>

<!-- ================= SITE IMAGES ================= -->
<section class="dashboard-card">
  <h2>Manage Site Images</h2>

  <label>Home Section Image</label>
  <input id="home-img-input" placeholder="Home image URL">
  <img id="home-img-preview">
  <button onclick="updateSiteImage('home')">Update Home Image</button>

  <hr style="margin:20px 0;">

  <label>About Section Image</label>
  <input id="about-img-input" placeholder="About image URL">
  <img id="about-img-preview">
  <button onclick="updateSiteImage('about')">Update About Image</button>
</section>

<!-- ================= PROJECTS ================= -->
<section class="dashboard-card">
  <h2>Manage Projects</h2>

  <input id="p-title" placeholder="Project Title">
  <input id="p-desc" placeholder="Description">
  <input id="p-img" placeholder="Image URL">
  <button onclick="addProject()">Add Project</button>

  <button id="logout-btn" style="float:right;">Logout</button>

  <div id="project-list"></div>
</section>

<!-- ================= TASKS ================= -->
<section class="dashboard-card">
  <h2>Manage Tasks</h2>
  <ul id="task-list-dashboard"></ul>
</section>

<!-- ================= MESSAGES ================= -->
<section class="dashboard-card">
  <h2>Messages</h2>
  <ul id="message-list"></ul>
</section>

<script>
// ================= AUTH =================
const token = localStorage.getItem("adminToken");
if (!token) window.location.href = "admin-login.html";

document.getElementById("logout-btn").addEventListener("click", () => {
  localStorage.removeItem("adminToken");
  window.location.href = "admin-login.html";
});

// ================= SITE IMAGES =================
async function loadSiteImages() {
  const res = await fetch("/api/site-content");
  const data = await res.json();

  data.forEach(item => {
    if (item.section === "home") {
      homeImgInput.value = item.image;
      homeImgPreview.src = item.image;
    }
    if (item.section === "about") {
      aboutImgInput.value = item.image;
      aboutImgPreview.src = item.image;
    }
  });
}

async function updateSiteImage(section) {
  const input = section === "home" ? homeImgInput : aboutImgInput;
  const image = input.value.trim();

  if (!image) return alert("Image URL required");

  await fetch(`/api/site-content/${section}`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "Authorization": token
    },
    body: JSON.stringify({ image })
  });

  alert(section + " image updated");
  loadSiteImages();
}

const homeImgInput = document.getElementById("home-img-input");
const aboutImgInput = document.getElementById("about-img-input");
const homeImgPreview = document.getElementById("home-img-preview");
const aboutImgPreview = document.getElementById("about-img-preview");

homeImgInput.addEventListener("input", () => {
  homeImgPreview.src = homeImgInput.value;
});
aboutImgInput.addEventListener("input", () => {
  aboutImgPreview.src = aboutImgInput.value;
});

// ================= PROJECTS =================
async function loadProjects() {
  const res = await fetch("/api/projects");
  const projects = await res.json();
  const container = document.getElementById("project-list");
  container.innerHTML = "";

  projects.forEach(p => {
    const div = document.createElement("div");
    div.innerHTML = `
      <span>
        <img src="${p.img}" width="80">
        <strong>${p.title}</strong> - ${p.desc}
      </span>
      <button onclick="deleteProject(${p.id})">Delete</button>
    `;
    container.appendChild(div);
  });
}

async function addProject() {
  if (!pTitle.value || !pDesc.value || !pImg.value)
    return alert("Fill all fields");

  await fetch("/api/projects", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": token
    },
    body: JSON.stringify({
      title: pTitle.value,
      desc: pDesc.value,
      img: pImg.value
    })
  });

  pTitle.value = "";
  pDesc.value = "";
  pImg.value = "";
  loadProjects();
}

async function deleteProject(id) {
  await fetch(`/api/projects/${id}`, {
    method: "DELETE",
    headers: { "Authorization": token }
  });
  loadProjects();
}

const pTitle = document.getElementById("p-title");
const pDesc = document.getElementById("p-desc");
const pImg = document.getElementById("p-img");

// ================= TASKS =================
async function loadTasks() {
  const res = await fetch("/api/tasks");
  const tasks = await res.json();
  const list = document.getElementById("task-list-dashboard");
  list.innerHTML = "";

  tasks.forEach(t => {
    const li = document.createElement("li");
    li.innerHTML = `
      <span>${t.title} (${t.completed ? "Done" : "Pending"})</span>
      <span>
        <button onclick="toggleTask(${t.id})">Toggle</button>
        <button onclick="deleteTask(${t.id})">Delete</button>
      </span>
    `;
    list.appendChild(li);
  });
}

async function toggleTask(id) {
  await fetch(`/api/tasks/${id}`, { method: "PUT" });
  loadTasks();
}

async function deleteTask(id) {
  await fetch(`/api/tasks/${id}`, { method: "DELETE" });
  loadTasks();
}

// ================= MESSAGES =================
async function loadMessages() {
  const res = await fetch("/api/messages", {
    headers: { "Authorization": token }
  });
  const messages = await res.json();
  const list = document.getElementById("message-list");
  list.innerHTML = "";

  messages.forEach(m => {
    const li = document.createElement("li");
    li.innerHTML = `
      <span>${m.name} (${m.email}): ${m.message}</span>
      <button onclick="deleteMessage(${m.id})">Delete</button>
    `;
    list.appendChild(li);
  });
}

async function deleteMessage(id) {
  await fetch(`/api/messages/${id}`, {
    method: "DELETE",
    headers: { "Authorization": token }
  });
  loadMessages();
}

// ================= INIT =================
loadSiteImages();
loadProjects();
loadTasks();
loadMessages();
</script>

</body>
</html>
